name: dividends

# OpenDART '현금·현물배당결정' 공시 전 종목 수집 (배당 D-3 검정용)
# 하루 호출 한도 2만 건을 배당 캘린더 저장소와 나눠 쓰므로 실행당 8,000건만 쓰고 다음 날 이어서 모은다.
on:
  push:
    branches: [main]
    paths: ["kick/dividends"]   # 서버 PC 06:30 실행 신호 (GitHub 예약은 몇 시간씩 밀릴 수 있음)
  schedule:
    - cron: "10 20 * * 0-4"   # 평일 05:10 KST (아침 분석 전)
  workflow_dispatch:
    inputs:
      budget:
        description: "이번 실행에서 쓸 DART 호출 수"
        default: "8000"

permissions:
  contents: write

concurrency:
  group: dividends
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main   # 줄 서서 기다린 실행도 최신 장부에서 시작 (트리거 시점 커밋 아님)
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: 배당 공시 수집
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python -m desk.dividends --budget ${{ inputs.budget || '8000' }}
      - name: 결과 커밋
        if: always()   # 수집이 도중에 실패해도 그때까지 모은 것은 저장
        run: |
          git config user.name "desk-bot"
          git config user.email "desk-bot@users.noreply.github.com"
          [ -d data/dividends ] || { echo "::warning::배당 자료 없음 — 저장소 Secrets 에 DART_API_KEY 를 넣어 주세요"; exit 0; }
          git add data/dividends
          git diff --cached --quiet && exit 0
          git commit -m "dividends: $(TZ=Asia/Seoul date +%F)"
          git pull --rebase -q origin main
          git push
