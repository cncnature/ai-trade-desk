name: evening-eval

# 오늘 아침 추천 종목을 오늘 종가로 채점하고 조언을 만든다 (평일 20:15 KST, NXT 애프터마켓 종료 뒤)
on:
  schedule:
    - cron: "15 11 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: evening-eval
  cancel-in-progress: true

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 평가·조언
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DESK_AI: ${{ vars.DESK_AI || 'off' }}
        run: |
          python run_eval.py
          python run_close.py
      - name: 결과 커밋
        run: |
          git config user.name "desk-bot"
          git config user.email "desk-bot@users.noreply.github.com"
          git add docs/data/eval.json docs/data/close.json state/eval_rows.json
          git diff --cached --quiet && exit 0
          git commit -m "eval: $(TZ=Asia/Seoul date +%F)"
          git pull --rebase -q origin main
          git push
