name: research
on:
  workflow_dispatch:
    inputs:
      script:
        description: "tools/ 아래 스크립트"
        default: "streak_test.py"
permissions:
  contents: write
concurrency:
  group: research
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: 시세 캐시 복원 (읽기 전용)
        uses: actions/cache/restore@v6
        with:
          path: data/cache
          key: px-none
          restore-keys: px-
      - run: pip install -r requirements.txt
      - run: python tools/probe_pension.py || true
      - run: python tools/${{ inputs.script }}
      - name: 결과 커밋
        if: always()
        run: |
          git config user.name "desk-bot"
          git config user.email "desk-bot@users.noreply.github.com"
          git add reports || true
          git diff --cached --quiet || git commit -m "research: ${{ inputs.script }}"
          git pull --rebase -q origin main && git push || true
