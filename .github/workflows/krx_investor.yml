name: krx-investor
on:
  workflow_dispatch:
    inputs:
      days:
        description: "달력일 수"
        default: "520"
permissions:
  contents: write
concurrency:
  group: krx-investor
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install pykrx pandas
      - run: python tools/fetch_krx_investor.py --days ${{ inputs.days }}
      - name: 커밋
        if: always()
        run: |
          git config user.name "desk-bot"
          git config user.email "desk-bot@users.noreply.github.com"
          git add data/krx || true
          git diff --cached --quiet || git commit -m "krx investor: $(TZ=Asia/Seoul date +%F)"
          git pull --rebase -q origin main && git push || true
