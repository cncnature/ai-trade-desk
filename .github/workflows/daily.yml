name: daily-desk

# 아침 리포트 흐름 (KST)
#   07:20 서버 PC 자동 운영이 flow.db 갱신 → 07:30 export_flow.py 가 data/flow 를 푸시 → 이 워크플로 즉시 실행
#   07:50 예비 실행: 서버 PC가 꺼져 푸시가 없던 날에만 기존 수급으로 실행 (이미 돌았으면 건너뜀)
on:
  push:
    branches: [main]
    paths: ["data/flow/**"]
  schedule:
    - cron: "50 22 * * 0-4"   # 평일 07:50 KST
  workflow_dispatch:
    inputs:
      revalidate:
        description: "검증 강제 재실행"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-desk
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: 시세 캐시 복원
        uses: actions/cache@v6
        with:
          path: data/cache
          key: px-${{ github.run_id }}
          restore-keys: px-
      - run: pip install -r requirements.txt
      - name: 수집·검증·모의매매
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DESK_AI: ${{ vars.DESK_AI || 'off' }}
          DESK_TOP_N: ${{ vars.DESK_TOP_N || '100' }}
          # 사전 등록(2026-11-10): 전 종목 · 외국인 보유율 수준 단일 검정 · 추가 유동성 컷 없음 (H5 와 같은 조건)
          DESK_UNIVERSE: flow
          DESK_FACTORS: frgn_hold
          DESK_LIQ_CUT: "0"
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "schedule" ]; then ARGS="--skip-if-done-today"; fi
          if [ "${{ inputs.revalidate }}" = "true" ]; then ARGS="$ARGS --revalidate"; fi
          python run_daily.py $ARGS
      - name: 결과 커밋
        run: |
          git config user.name "desk-bot"
          git config user.email "desk-bot@users.noreply.github.com"
          git add docs/data state
          git diff --cached --quiet || git commit -m "daily: $(TZ=Asia/Seoul date +%F)"
          git pull --rebase -q origin main
          git push
